  body:after{content:"";position:fixed;inset:0;background:linear-gradient(135deg,rgba(7,38,72,.34),rgba(25,112,118,.12) 48%,rgba(8,47,73,.28));z-index:-2;pointer-events:none}
  .loginPage{position:relative;z-index:1;min-height:100vh;display:grid;place-items:center;padding:30px 18px}
  .card{width:min(450px,100%);padding:30px 32px 29px;border-radius:27px;background:rgba(255,255,255,.72);border:1px solid rgba(255,255,255,.78);box-shadow:0 28px 80px rgba(4,31,57,.28),inset 0 1px 0 rgba(255,255,255,.65);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
  .brandTop{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;margin:0 0 27px;padding:0;border:0}
  .brandMark{width:58px;height:58px;border-radius:16px;background:linear-gradient(135deg,#78adff,#1e6cf0);display:grid;place-items:center;color:#fff;font-weight:900;font-size:25px;box-shadow:0 15px 30px rgba(30,108,240,.28)}
  .brandTop strong{display:block;color:#10264a;font-size:23px;line-height:1.05;letter-spacing:-.035em}.brandTop span{display:block;color:#617795;font-size:11px;margin-top:5px}
  .loginHead{text-align:center}.eyebrow{font-size:10px;font-weight:900;letter-spacing:.16em;color:#155eea}.loginHead h1{margin:8px 0 6px;font-size:30px;line-height:1.08;letter-spacing:-.04em;color:#081a34}.loginHead p{margin:0 0 24px;color:#5d718d;font-size:13px}
  .field{display:grid;gap:7px;margin-top:15px}.field label{font-size:12px;font-weight:850;color:#213753}.inputWrap{position:relative}.field input{width:100%;height:51px;padding:0 47px 0 14px;border:1px solid rgba(190,207,226,.95);border-radius:12px;background:rgba(255,255,255,.72);outline:none;font-size:14px;color:var(--text);transition:border-color .15s,box-shadow .15s,background .15s}.field input::placeholder{color:#7d91aa}.field input:focus{background:rgba(255,255,255,.9);border-color:#5f9cff;box-shadow:0 0 0 4px rgba(59,130,246,.14)}
  .toggle{position:absolute;right:6px;top:6px;width:37px;height:39px;border:0;border-radius:9px;background:rgba(247,250,253,.76);color:#5f7692;cursor:pointer}
  .submit{width:100%;height:51px;margin-top:22px;border:0;border-radius:12px;background:linear-gradient(135deg,#3d8cff,#155bea);color:#fff;font-weight:850;letter-spacing:.01em;cursor:pointer;box-shadow:0 12px 26px rgba(37,99,235,.25);transition:transform .15s,box-shadow .15s,filter .15s}.submit:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 15px 30px rgba(37,99,235,.3);filter:saturate(1.05)}.submit:disabled{opacity:.78;cursor:wait}
  .error{display:none;margin-top:13px;padding:10px 12px;border-radius:9px;background:rgba(255,241,242,.94);border:1px solid #fecdd3;color:#be123c;font-size:12px;line-height:1.45}.error.show{display:block}

  @media(max-width:600px){.loginPage{padding:20px 14px}.card{padding:27px 21px 26px;border-radius:22px}.brandMark{width:54px;height:54px}.brandTop strong{font-size:21px}.loginHead h1{font-size:27px}.loginPage:before{content:"";position:fixed;inset:0;background:rgba(8,48,74,.12);pointer-events:none}}
  @media(max-height:700px) and (min-width:601px){.loginPage{padding:18px}.card{padding-top:23px;padding-bottom:23px}.brandTop{margin-bottom:19px}.field{margin-top:11px}.submit{margin-top:17px}.security{margin-top:13px}.foot{margin-top:12px}}

</head>
<body>
  <main class="loginPage">
    <section class="card" aria-label="Vns.WorkSpace sign in">
      <div class="brandTop">
        <div class="brandMark">V</div>
        <div>
          <strong>Vns.WorkSpace</strong>
          <span>Secure Email Operations Platform</span>
        </div>
      </div>

      <div class="loginHead">
        <div class="eyebrow">WORKSPACE ACCESS</div>
        <h1>Welcome back</h1>
        <p>Sign in with your Employee ID to continue.</p>
      </div>

      <form id="loginForm" novalidate>
        <div class="field">
          <label for="employeeId">Employee ID</label>
          <input id="employeeId" autocomplete="username" placeholder="Enter Employee ID" maxlength="40" required autofocus>
        </div>

        <div class="field">
          <label for="password">Password</label>
          <div class="inputWrap">
            <input id="password" type="password" autocomplete="current-password" placeholder="Enter password" maxlength="128" required>
            <button type="button" class="toggle" id="togglePassword" aria-label="Show password">◉</button>
          </div>
        </div>

        <button class="submit" id="loginBtn" type="submit">Sign in</button>
        <div class="error" id="errorBox" role="alert"></div>
      </form>

      <div class="security">
        <span>🔒</span>
        <div><b>Secure workspace</b><br>Access is controlled by your Employee ID, role and account status.</div>
      </div>

      <div class="foot">Vns.WorkSpace • Email Bulk Tool</div>
    </section>
  </main>

  <script>
    var $=function(id){return document.getElementById(id);};
    var submitting=false;

    $('togglePassword').addEventListener('click',function(){
      var p=$('password');
      p.type=p.type==='password'?'text':'password';
      this.textContent=p.type==='password'?'◉':'◌';
    });

    function showError(msg){
      var b=$('errorBox');
      b.textContent=msg || 'Unable to sign in. Please try again.';
      b.classList.add('show');
    }

    function clearError(){
      $('errorBox').textContent='';
      $('errorBox').classList.remove('show');
    }

    function resetButton(){
      var btn=$('loginBtn');
      btn.disabled=false;
      btn.textContent='Sign in';
      submitting=false;
    }

    function goToWorkspace(result){
      // Use the URL returned by the server. This avoids a second server round-trip
      // through getWebAppUrl(), which can leave the button stuck in a loading state.
      var base=result && result.appUrl ? result.appUrl : window.location.href.split('?')[0];
      var target=base+'?session='+encodeURIComponent(result.token);
      window.top.location.replace(target);
    }

    $('loginForm').addEventListener('submit',function(e){
      e.preventDefault();
      if(submitting)return;
      clearError();

      var id=String($('employeeId').value||'').trim().toUpperCase();
      var pass=$('password').value;
      if(!id||!pass){showError('Employee ID and password are required.');return;}

      submitting=true;
      var btn=$('loginBtn');
      btn.disabled=true;
      btn.innerHTML='<span class="spinner"></span>Signing in';

      google.script.run
        .withSuccessHandler(function(result){
          if(!result || !result.success || !result.token){
            resetButton();
            showError('Login could not be completed. Please try again.');
            return;
          }
          goToWorkspace(result);
        })
        .withFailureHandler(function(err){
          resetButton();
          showError(err && err.message ? err.message : 'Employee ID or password is incorrect.');
        })
        .authenticateUser(id,pass);
    });

    // Enter key works naturally in both fields; no extra UI action is required.
    $('employeeId').focus();
  </script>
</body>
</html>
